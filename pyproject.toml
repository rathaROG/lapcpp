[build-system]
requires = ["setuptools>=77", "numpy>=2.0", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
timeout = 180
markers = [
  "cross_package: requires both installed packages (--run-cross-package)",
]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
skip = "*-win32"
# Match LAPX's lightweight wheel checks; full suites run in tests.yaml.
test-requires = ["numpy"]
test-command = "python {project}/.github/tests/check_wheel.py"

[[tool.cibuildwheel.overrides]]
select = "cp3{12,13,14,15}-manylinux_armv7l"
# Match LAPX: manylinux_2_31 has GCC 9; NumPy 2.5 requires GCC >= 10.3.
environment.PIP_CONSTRAINT = "/project/.github/constraints/numpy-armv7-build.txt"
# Wheel tests install NumPy in the same GCC 9 image.
test-environment.PIP_CONSTRAINT = "/project/.github/constraints/numpy-armv7-build.txt"
