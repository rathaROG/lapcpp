name: Native checks and sanitizers
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build native tests
        run: |
          cmake -S tests/native -B build/native -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/native --config Debug
      - name: Test resources, failures and concurrency
        run: ctest --test-dir build/native -C Debug --output-on-failure
      - name: Check Python exceptions from native status codes
        run: |
          python -m pip install "numpy>=2" "Cython>=3" "setuptools>=77"
          python tests/check_native_errors.py
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v7
      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Reserve a compatible address range for ThreadSanitizer
        if: matrix.sanitizer == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Build instrumented native tests
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          cmake -S tests/native -B build/sanitizer -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DLAPCPP_SANITIZER="$SANITIZER"
          cmake --build build/sanitizer --parallel 2
      - name: Test with sanitizer errors treated as failures
        run: ctest --test-dir build/sanitizer --output-on-failure
